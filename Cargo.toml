[workspace]
members = ["crates/catalog-core", "crates/clanker-ui", "crates/clanker-ui-runtime", "crates/clanker-chart-worker"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.1"
license = "MIT"

# Keep the debug CLI and test-built executable below Native's 64 MiB admission guard.
[profile.dev]
debug = 0

[profile.test]
debug = 0

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
