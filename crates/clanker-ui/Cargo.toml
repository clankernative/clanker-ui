[package]
name = "clanker-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "clanker-ui"
publish = false

[dependencies]
catalog-core = { path = "../catalog-core" }
cssparser = "=0.35.0"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
clap.workspace = true
tempfile = "3"
minijinja = { version = "=2.12.0", default-features = false, features = ["debug", "multi_template", "serde", "fuel", "unstable_machinery"] }
base64 = "=0.22.1"
scraper = "=0.24.0"
url = "2"
tar = { version = "=0.4.46", default-features = false }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
