name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --locked
      - name: Verify locked package
        run: cargo run --locked -- verify --lock examples/button-app/clanker-ui.lock.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test isolated component interactions
        run: node --test tests/components/*.test.mjs
