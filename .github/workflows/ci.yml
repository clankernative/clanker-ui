name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --locked
      - name: Verify locked package
        run: cargo run --locked -- verify --lock examples/button-app/ui.lock.json
      - name: Build release CLI
        run: cargo build --locked --release --bin clanker-ui
      - name: Prepare and verify relocatable Native bundle
        run: |
          ./target/release/clanker-ui native-bundle --package packages/vanilla --output target/native-bundle --source-revision "${GITHUB_SHA}"
          ./target/release/clanker-ui verify-native-bundle --bundle target/native-bundle
      - name: Prepare deterministic versioned assets and verify safe extraction
        run: ./target/release/clanker-ui native-release --bundle target/native-bundle --output target/native-release
      - uses: actions/upload-artifact@v4
        with:
          name: clanker-ui-native-linux-x86_64
          # The producer admits exactly archive/bootstrap/notices + their SHAs and target metadata.
          path: target/native-release/*
          if-no-files-found: error
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test isolated component and chart interactions
        run: node --test tests/components/*.test.mjs tests/browser/chart-interaction.test.mjs
